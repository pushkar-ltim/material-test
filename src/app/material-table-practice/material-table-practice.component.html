<table mat-table [dataSource]="dataSource">

    <ng-container *ngFor="let column of stickyColumns">
        <ng-container [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef>
                {{ column }}
            </th>
            <td mat-cell *matCellDef="let holdingRow">
                {{ holdingRow[column] }} 
            </td>
        </ng-container>
    </ng-container>

    <ng-container *ngFor="let column of moveableColumns">
        <ng-container [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef>
                {{ column }}
            </th>
            <td mat-cell *matCellDef="let holdingRow">
                {{ holdingRow[column] }} 
            </td>
        </ng-container>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>
