<section class="holdings-table-container">
    <table mat-table [dataSource]="dataSource" multiTemplateDataRows>

        <ng-container [matColumnDef]="'name'" sticky>
            <th mat-header-cell *matHeaderCellDef>
                name
            </th>
            <td mat-cell *matCellDef="let holdingRow">
                {{ holdingRow.name }}
            </td>
        </ng-container>

        <ng-container *ngFor="let column of moveableColumns">
            <ng-container [matColumnDef]="column">
                <th mat-header-cell *matHeaderCellDef>
                    {{ column }}
                </th>
                <td mat-cell *matCellDef="let holdingRow">
                    {{ holdingRow[column] }}
                </td >
            </ng-container>
        </ng-container>

        <ng-container [matColumnDef]="'toggleAction'" stickyEnd>
            <th mat-header-cell *matHeaderCellDef>
                <button>Toggle</button>

            </th>
            <td mat-cell *matCellDef="let holdingRow">
                <button>Toggle</button>
            </td>
        </ng-container>

        <ng-container matColumnDef="accounts">
            <td mat-cell [attr.colspan]="displayedColumns.length" *matCellDef="let holding"
                style="padding-left: 0; padding-right: 0;">
                <table mat-table [dataSource]="holding.accounts" class="accounts-child-table">

                    <ng-container [matColumnDef]="'name'" sticky>
                        <th mat-header-cell *matHeaderCellDef> Name </th>
                        <td mat-cell *matCellDef="let holdingRow">
                            {{ holdingRow.name }}
                        </td>
                    </ng-container>

                    <ng-container *ngFor="let column of moveableColumns">
                        <ng-container [matColumnDef]="column">
                            <th mat-header-cell *matHeaderCellDef> {{column}} </th>
                            <td mat-cell *matCellDef="let accountRow">
                                {{ accountRow[column] }}
                            </td>
                        </ng-container>
                    </ng-container>

                    <ng-container [matColumnDef]="'toggleAction'" stickyEnd>
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let holdingRow">
                            <button>Toggle</button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: ['accounts'];"></tr>

    </table>

</section>
