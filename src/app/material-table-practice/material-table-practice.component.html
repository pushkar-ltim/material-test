<section class="example-container holdings-table-container ">
    <table mat-table [dataSource]="dataSource" multiTemplateDataRows>

        <!-- Holding columns (existing code) -->
        <ng-container [matColumnDef]="'name'" sticky>
            <th mat-header-cell *matHeaderCellDef>name</th>
            <td mat-cell *matCellDef="let holdingRow">{{ holdingRow.name }}</td>
        </ng-container>

        <ng-container *ngFor="let column of moveableColumns">
            <ng-container [matColumnDef]="column">
                <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
                <td mat-cell *matCellDef="let holdingRow">{{ holdingRow[column] }}</td>
            </ng-container>
        </ng-container>

        <ng-container [matColumnDef]="'toggleAction'" stickyEnd>
            <th mat-header-cell *matHeaderCellDef>
                <button (click)="expandedElement = null">Collapse All</button>
            </th>
            <td mat-cell *matCellDef="let holdingRow">
                <button (click)="expandedElement = expandedElement === holdingRow ? null : holdingRow">
                    {{ expandedElement === holdingRow ? 'Hide Accounts' : 'Show Accounts' }}
                </button>
            </td>
        </ng-container>

        <!-- Detail row for accounts -->
        <ng-container matColumnDef="detail">
            <td mat-cell *matCellDef="let holdingRow" [attr.colspan]="displayedColumns.length">
                <div *ngIf="holdingRow.accounts?.length">
                    <ol class="accounts-child-table">
                        <li *ngFor="let account of holdingRow.accounts" class="account-row detail-row">
                            <td *ngFor="let column of displayedColumns">
                                <strong>{{ column }}:</strong> {{ account[column] }}
                            </td>
                        </li>
                    </ol>
                </div>
            </td>
        </ng-container>

        <!-- Header and row definitions -->
        <th mat-header-row *matHeaderRowDef="displayedColumns"></th>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"
            [class.expanded]="expandedElement === row"></tr>
        <tr mat-row *matRowDef="let row; columns: ['detail']; when: isExpanded"
            class="account-row"
            ></tr>
    </table>
</section>
